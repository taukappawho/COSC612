name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0  # Ensure this version exists
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to remote server
        run: |
          ssh user@194.195.92.140 'cd /backend && git pull origin main && ./deploy.sh'
