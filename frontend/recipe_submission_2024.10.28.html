10.28.2024

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Have No Mouth and I Must Eat: Recipe Submission Form</title>
    <link rel="stylesheet" href="r_submission_style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="recipe.html">Submit Recipe</a>
        <a href="contact.html">Contact Us</a>
        <a href="#" class="nav-right" onclick="alert('For assistance, email support@recipe.com or call 1-800-RECIPE.')">Help</a>
    </div>

    <div class="container">
        <h1>I Have No Mouth and I Must Eat</h1>
        <h2>Recipe Submission Form</h2>

        <!-- Recipe submission form -->
        <form id="recipeForm" action="submit_recipe.php" method="POST">
            <div id="ingredient-list">
                <div class="form-group">
                    <input type="text" name="ingredient[]" placeholder="Ingredient (max 45 chars)" maxlength="45" required>
                    <input type="number" name="quantity[]" placeholder="Quantity" min="0" step="any" required>
                    <select name="unit[]" required>
                        <option value="">Unit</option>
                        <option value="oz">oz</option>
                        <option value="lb">lb</option>
                        <option value="grams">grams</option>
                        <option value="mL">mL</option>
                        <option value="cup">cup</option>
                        <option value="tsp">teaspoon</option>
                        <option value="tbsp">tablespoon</option>
                    </select>
                    <button type="button" onclick="removeIngredient(this)">X</button>
                </div>
            </div>

            <button class="add-ingredient" type="button" onclick="addIngredient()">Add Ingredient</button>
            <button class="submit-recipe" type="submit">Submit Recipe</button>
        </form>
    </div>

    <!-- Footer with fictitious copyright -->
    <footer>
        &copy; 2024 I Have No Mouth and I Must Eat. All rights reserved.
    </footer>

<!-- This script allows for dynamic ingredient entry.  Dynamic is defined as being able to add more than 1 ingredient while having the ability to remove any ingredient as needed-->

    <script>
        function addIngredient() {
            const ingredientList = document.getElementById('ingredient-list');
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';

            formGroup.innerHTML = 
                '<input type="text" name="ingredient[]" placeholder="Ingredient (max 45 chars)" maxlength="45" required>' +
                '<input type="number" name="quantity[]" placeholder="Quantity" min="0" step="any" required>' +
                '<select name="unit[]" required>' +
                    '<option value="">Unit</option>' +
                    '<option value="oz">oz</option>' +
                    '<option value="lb">lb</option>' +
                    '<option value="grams">grams</option>' +
                    '<option value="mL">mL</option>' +
                    '<option value="cup">cup</option>' +
                    '<option value="tsp">teaspoon</option>' +
                    '<option value="tbsp">tablespoon</option>' +
                '</select>' +
                '<button type="button" onclick="removeIngredient(this)">X</button>';

            ingredientList.appendChild(formGroup);
        }

        function removeIngredient(button) {
            const formGroup = button.parentNode;
            formGroup.remove();
        }
    </script>

</body>
</html>
