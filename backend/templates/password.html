<!DOCTYPE html>
<html lang="en">
<head>
    <title>I Have No Mouth...</title>
    <style>
        .error {
            color: red;
            display: none;
        }
    </style>
    <script>
        async function handleFormSubmit(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const errorText = document.getElementById("error_text");

            // Check if passwords match
            if (password !== confirmPassword) {
                errorText.style.display = "block";
                return;
            } else {
                errorText.style.display = "none";
            }

            // Create FormData and add password fields
            const formData = new FormData();
            formData.append("password", password);

            try {
                const response = await fetch("https://recipe.naurot.com/password?token={{token}}", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    alert("Form submitted successfully!");
                } else {
                    alert("Form submission failed.");
                }
            } catch (error) {
                console.error("Error submitting form:", error);
                alert("An error occurred during submission.");
            }
        }
    </script>
</head>
<body>

    <h2>{{ text }}</h2>
    <form id="passwordForm" onsubmit="handleFormSubmit(event)">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br><br>

        <div id="error_text" class="error">Passwords do not match.</div><br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
