<html>
<header>
    <title>
        I Have No Mouth and I Must Eat
    </title>
</header>

<body>
    <div class="container">
        <h1>Recipe Submission Page</h1>
        <form id="recipeForm">
            <div class="form-group">
                <label for="recipe_name"><input type="text" for="recipe_name" name="recipe_name" required
                        placeholder="Recipe Name"></label>
                <br><br>
                <label for="instruct">
                    <textarea for="instruct" name="instruct" rows="30" cols="40"
                        placeholder="Recipe Instructions"></textarea>
                </label>
                <br><br>
                <label for="img">Choose a Recipe Image:
                </label>
                <br>
                <input type="file" id="img" name="img" accept="image/png" required>
                <br><br><br>
                <div id="ingredient-list">
                </div>
            </div>
            <br>
            <button class="add-ingredient" id="addIngredientButton" type="button" style="margin-right:50px">Add
                Ingredient</button>
            <button class="submit-recipe" type="submit">Submit Recipe</button>
        </form>
    </div>
</body>

<script>
    let ingOptions = ""
    let unitOptions = ""
    const ingredients = JSON.parse(localStorage.getItem("ingredients")) || {}



    document.addEventListener("DOMContentLoaded", async () => {
        const UNITS = ["slice", "dash", "bunch", "dozen", "ounce", "tsp", "Tbsp", "cup", "quart", "pound", "gal", "N/A"];
        const ingredientList = document.getElementById("ingredient-list")
        const addIngredientButton = document.getElementById("addIngredientButton");

        generateOptions()

        addIngredientButton.addEventListener("click", () => addIngredient(ingredientList));

        function addIngredient(ingredientList) {
            const formGroup = document.createElement('div');
            formGroup.className = 'form-group';
            formGroup.innerHTML = `
            <select id="dropdown" name="ingredient[]" onchange="handleIngredientChange(this)">${ingOptions}</select>
    <input type="number" name="quantity[]" placeholder="Quantity" min="0" value="0" step="any" required>
    <select name="unit[]">${unitOptions}</select>
    <button type="button" class="remove-ingredient">X</button>
    <br>
    `;
            ingredientList.appendChild(formGroup);
        }

        ingredientList.addEventListener("click", e => {
            if (e.target.classList.contains("remove-ingredient")) {
                e.target.parentNode.remove()
            }
        })

        function generateOptions() {
            // Generate ingredient options
            ingOptions = Object.entries(ingredients)
                .map(([key, value]) => `<option value="${value}">${key}</option>`)
                .join('');
            ingOptions += `<option value="new">New Ingredient</option>`; // Always include "New Ingredient"
            // Generate unit options
            unitOptions = UNITS.map(unit => `<option value="${UNITS.indexOf(unit)}">${unit}</option>`).join('');
        }
    })

    // Handle ingredient dropdown changes
    async function handleIngredientChange(selectElement) {
        function generateOptions() {
            // Generate ingredient options
            ingOptions = Object.entries(ingredients)
                .map(([key, value]) => `<option value="${value}">${key}</option>`)
                .join('');
            ingOptions += `<option value="new">New Ingredient</option>`; // Always include "New Ingredient"
            // Generate unit options
            <!-- unitOptions = UNITS.map(unit => `<option value="${UNITS.indexOf(unit)}">${unit}</option>`).join(''); -->
        }
        if (selectElement.value === "new") {
            const newIngredient = prompt("Enter the name of the new ingredient:");
            console.log(newIngredient)
            if (newIngredient) {
                try {
                    const url = `https://recipe.naurot.com/recipes/ingredients?ing=${newIngredient}`
                    const response = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer {{ token }}`
                        }
                    })
                    if (response.ok) {
                        console.log(response.data)
                        const result = await response.json()
                        const [id, ing, usable] = result.response.data
                        console.log(result.response.data)
                        console.log(`id: ${id}, ing: ${ing}, usable: ${usable}`)
                        if (usable == 0) {
                            ingredients[ing] = id
                            localStorage.setItem("ingredients", JSON.stringify(ingredients));
                            generateOptions();
                            document.querySelectorAll("#dropdown").forEach((dropdown) => {
                                dropdown.innerHTML = ingOptions;
                            });
                            selectElement.value = id
                        }
                    } else { alert("failed to add new ingredient") }
                } catch (err) {
                    console.log(`Error in ingredient add: ${err}`)
                    alert(`${err} adding ingredient`)
                }

                // Select the newly added ingredient

            } else {
                selectElement.value = ""; // Reset to default if no name is entered
            }
        }
    }

    document.getElementById("recipeForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        // Serialize ingredients into a comma-separated string
        const ingredients = Array.from(document.querySelectorAll('[name="ingredient[]"]')).map((ingredientInput, index) => {
            const quantity = document.querySelectorAll('[name="quantity[]"]')[index].value;
            const unit = document.querySelectorAll('[name="unit[]"]')[index].value;
            return `${ingredientInput.value.trim()} ${quantity} ${unit}`;
        }).join(',');
        formData.set("ingredients", ingredients);
        console.log(formData)
        console.log(ingredients)
        console.log(formData.get("ingredients"))
        try {
            const response = await fetch('https://recipe.naurot.com/recipes/create', {
                method: 'POST',
                body: formData,
                headers: {
                    'Authorization': `Bearer {{ token }}`,
                },
            });

            if (response.ok) {
                const result = await response.json();
                alert("Recipe submitted successfully!");
                console.log(result);
            } else {
                const error = await response.json();
                alert(`Error: ${error.message || 'Failed to submit recipe.'}`);
            }
        } catch (err) {
            console.error("Submission error:", err);
            alert("An unexpected error occurred.");
        } finally {
            window.close()
        }
    });
</script>

</html>
